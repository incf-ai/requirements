[package]
name = "gui-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gui"
path = "src/main.rs"

[features]
# On by default, but every use of it is additionally gated on
# `debug_assertions` (see `view.rs`/`lib.rs`) — so it's compiled in for a
# normal `cargo build`/`cargo run` (dev profile) without needing to
# remember the flag, but still compiled out of a `--release` build even
# if this default feature stays enabled there. The stall/failure triggers
# it adds are actively harmful in a real user's hands, not just clutter,
# so it must never be on by accident in a release build; `--no-default-
# features` also disables it outright regardless of profile.
default = ["debug-panel"]
debug-panel = []

[dependencies]
gui-core = { path = "../gui-core" }
eframe = { workspace = true }
egui = { workspace = true }
# Only used for its glyph-name constants and `Variant::font_bytes()` — its
# own `add_to_fonts`/`Variant::font_data()` helpers pin an incompatible
# egui version (0.35) and so aren't usable directly; see `fonts.rs`.
egui-phosphor = { version = "0.13", default-features = false, features = ["regular"] }
rfd = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
accesskit = "0.24.1"
egui_kittest = { version = "0.36.1", features = ["eframe"] }
# Only for constructing `ValidationError` values in
# `validate_before_save_dialog` tests — gui-ui otherwise talks to
# gui-core exclusively through its `Command`/`Outcome` API, never
# `logical` directly.
logical = { workspace = true }
# For the randomized nav_history test only — always seeded, never system
# randomness, so runs stay reproducible. Already resolved in Cargo.lock at
# this version via `rfd`'s own `ashpd` dependency, so this adds no new
# download/version risk.
rand = "0.9"
syscalls = { path = "../syscalls" }
